<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f1220" />
  <title>Twixt · Multiplayer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231b2138'/%3E%3Cpath d='M15 45 28 19 49 32' fill='none' stroke='%23e6bb70' stroke-width='5'/%3E%3Cg fill='%23e6bb70'%3E%3Ccircle cx='15' cy='45' r='5'/%3E%3Ccircle cx='28' cy='19' r='5'/%3E%3Ccircle cx='49' cy='32' r='5'/%3E%3C/g%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css?v=22" />
</head>
<body>
  <section id="joinScreen" class="join-screen">
    <div class="join-art" aria-hidden="true">
      <div class="art-label">MAKE A CONNECTION.</div>
      <svg viewBox="0 0 320 320" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="holes" x="35" y="35" width="25" height="25" patternUnits="userSpaceOnUse"><circle cx="0" cy="0" r="2.3" fill="#8a7b5f" /></pattern>
          <clipPath id="boardClip"><rect x="10" y="10" width="300" height="300" rx="18" /></clipPath>
        </defs>
        <g clip-path="url(#boardClip)">
          <rect x="10" y="10" width="300" height="300" fill="#f7f1df" />
          <path d="M10 25H310M10 295H310" stroke="#e26363" stroke-opacity=".3" stroke-width="30" />
          <path d="M25 10V310M295 10V310" stroke="#578fdb" stroke-opacity=".3" stroke-width="30" />
          <rect x="33" y="33" width="254" height="254" fill="url(#holes)" />
          <path d="M110 60 160 85 135 135 160 185 135 235 185 260" stroke="#e26363" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M60 160 110 185M210 110 260 135" stroke="#578fdb" stroke-width="5" stroke-linecap="round" />
          <g fill="#e26363" stroke="#fffdf8" stroke-width="2"><circle cx="110" cy="60" r="7" /><circle cx="160" cy="85" r="7" /><circle cx="135" cy="135" r="7" /><circle cx="160" cy="185" r="7" /><circle cx="135" cy="235" r="7" /><circle cx="185" cy="260" r="7" /></g>
          <g fill="#578fdb" stroke="#fffdf8" stroke-width="2"><circle cx="60" cy="160" r="7" /><circle cx="110" cy="185" r="7" /><circle cx="210" cy="110" r="7" /><circle cx="260" cy="135" r="7" /></g>
        </g>
      </svg>
      <p>한 수씩, 나만의 길을 잇다.<br />서로의 길 사이에서 연결을 완성하세요.</p>
      <div class="art-caption">A GAME OF CONNECTIONS & STRATEGY</div>
    </div>
    <div class="join-card">
      <div class="eyebrow">THE BOARD GAME ROOM</div>
      <h1>Twixt<span class="title-dot">.</span></h1>
      <p class="join-copy">당신의 다음 한 수가, 새로운 길이 됩니다.</p>
      <label for="nameInput">플레이어 이름</label>
      <input id="nameInput" placeholder="이름을 입력하세요" autocomplete="nickname" />
      <label for="roomInput">방 코드 <span>같은 코드를 입력하면 함께 플레이해요</span></label>
      <input id="roomInput" placeholder="예: room1" value="room1" />
      <button id="joinBtn" type="button">온라인 방 참가 <span aria-hidden="true">↗</span></button>
      <p class="join-footer">2 PLAYERS · CONNECT & WIN · NO SIGN-UP</p>
    </div>
  </section>

  <div class="app" id="gameScreen" hidden>
    <aside class="sidebar">
      <h1>Twixt</h1>

      <div class="card">
        <div><strong>내 역할:</strong> <span id="myRole">-</span></div>
        <span id="turnText" hidden>-</span>
        <div><strong>상태:</strong> <span id="statusText">방에 접속해 주세요</span></div>
        <div id="turnBadge"></div>
        <div class="player-row red-row">
          RED: <span id="redPlayer">대기 중</span> (상하 연결)
        </div>
        <div class="player-row blue-row">
          BLUE: <span id="bluePlayer">대기 중</span> (좌우 연결)
        </div>
        <div id="requestInfo"></div>
      </div>

      <div class="card timer-card" id="timerCard">
        <strong>한 수 제한시간</strong>
        <div class="timer-selects">
          <label><select id="timerMinutes"></select><span>분</span></label>
          <label><select id="timerSeconds"></select><span>초</span></label>
        </div>
        <div id="turnTimer" class="turn-timer">타이머 꺼짐</div>
      </div>

      <div class="card buttons">
        <button id="swapBtn" disabled>진영 교체</button>
        <button id="restartBtn" disabled>다시 시작</button>
      </div>
    </aside>

    <main class="board-wrap">
      <canvas id="board" width="900" height="900"></canvas>
    </main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="pie-rule.js?v=22"></script>
  <script src="app.js?v=22"></script>
</body>
</html>
